<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Variante "Premium" du Trace — silhouette et yeux identiques à l'asset
       de référence, constellation de 3 sparkles or-Premium (token
       premium-rgb, cohérent avec DESIGN-TOKENS.md, distinct de l'or-rareté
       utilisé sur la variante célébration). Usage suggéré : écran
       d'activation Premium, accueil de l'onglet Premium sur le profil. -->
  <defs>
    <linearGradient id="trace-stroke-prem" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#9DABFF" stop-opacity="1"/>
      <stop offset="60%" stop-color="#C7BCEE" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#C7BCEE" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="trace-fill-prem" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#93A2FF" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#C7BCEE" stop-opacity="0.03"/>
    </linearGradient>
    <radialGradient id="eye-shine-prem" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#F5F3FF"/>
      <stop offset="28%" stop-color="#AEBBFF"/>
      <stop offset="65%" stop-color="#5C6BC9"/>
      <stop offset="100%" stop-color="#171A33"/>
    </radialGradient>
  </defs>

  <path d="M100 38
           C 128 38 152 62 152 95
           L 152 150
           C 152 150 146 168 136 156
           C 128 146 122 168 112 158
           C 105 151 100 168 91 160
           C 82 152 76 168 66 158
           C 58 150 52 160 48 150
           L 48 95
           C 48 62 72 38 100 38"
        fill="url(#trace-fill-prem)" stroke="url(#trace-stroke-prem)" stroke-width="4.2"
        stroke-linecap="round" stroke-linejoin="round"/>

  <ellipse cx="79" cy="94" rx="6.5" ry="8" fill="url(#eye-shine-prem)"/>
  <ellipse cx="121" cy="94" rx="6.5" ry="8" fill="url(#eye-shine-prem)"/>
  <circle cx="76.5" cy="90.5" r="1.4" fill="#FFFFFF"/>
  <circle cx="118.5" cy="90.5" r="1.4" fill="#FFFFFF"/>

  <!-- Constellation de sparkles or-Premium -->
  <g fill="#FFC850">
    <path d="M160 60l2.4 7 7 2.4-7 2.4-2.4 7-2.4-7-7-2.4 7-2.4z"/>
    <path d="M32 70l1.6 4.6 4.6 1.6-4.6 1.6-1.6 4.6-1.6-4.6-4.6-1.6 4.6-1.6z"/>
    <path d="M150 130l1.3 3.7 3.7 1.3-3.7 1.3-1.3 3.7-1.3-3.7-3.7-1.3 3.7-1.3z"/>
  </g>
</svg>
