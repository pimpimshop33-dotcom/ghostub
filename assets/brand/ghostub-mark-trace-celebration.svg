<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Variante "célébration / palier franchi" du Trace — silhouette et yeux
       identiques à l'asset de référence, halo de particules or-rareté
       (token tier-gold-rgb, cohérent avec la palette figée dans
       DESIGN-TOKENS.md) autour de la tête. Usage suggéré : écran de
       milestone (rang/collection), fin de série marquante. -->
  <defs>
    <linearGradient id="trace-stroke-cel" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#9DABFF" stop-opacity="1"/>
      <stop offset="60%" stop-color="#C7BCEE" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#C7BCEE" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="trace-fill-cel" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#93A2FF" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#C7BCEE" stop-opacity="0.03"/>
    </linearGradient>
    <radialGradient id="eye-shine-cel" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#F5F3FF"/>
      <stop offset="28%" stop-color="#AEBBFF"/>
      <stop offset="65%" stop-color="#5C6BC9"/>
      <stop offset="100%" stop-color="#171A33"/>
    </radialGradient>
  </defs>

  <!-- Halo de particules or-rareté, en arrière-plan -->
  <g fill="#F5DFA0" opacity=".85">
    <path d="M36 30l2 6 6 2-6 2-2 6-2-6-6-2 6-2z"/>
    <path d="M158 24l1.6 4.8 4.8 1.6-4.8 1.6-1.6 4.8-1.6-4.8-4.8-1.6 4.8-1.6z"/>
    <circle cx="34" cy="120" r="2.6"/>
    <circle cx="168" cy="110" r="3.2"/>
    <circle cx="100" cy="14" r="2.4"/>
  </g>

  <path d="M100 38
           C 128 38 152 62 152 95
           L 152 150
           C 152 150 146 168 136 156
           C 128 146 122 168 112 158
           C 105 151 100 168 91 160
           C 82 152 76 168 66 158
           C 58 150 52 160 48 150
           L 48 95
           C 48 62 72 38 100 38"
        fill="url(#trace-fill-cel)" stroke="url(#trace-stroke-cel)" stroke-width="4.2"
        stroke-linecap="round" stroke-linejoin="round"/>

  <ellipse cx="79" cy="94" rx="6.5" ry="8" fill="url(#eye-shine-cel)"/>
  <ellipse cx="121" cy="94" rx="6.5" ry="8" fill="url(#eye-shine-cel)"/>
  <circle cx="76.5" cy="90.5" r="1.4" fill="#FFFFFF"/>
  <circle cx="118.5" cy="90.5" r="1.4" fill="#FFFFFF"/>
</svg>
